baseURL: "https://aeo-app.github.io/"
locale: "en-US"
title: "AEO Intel Operations"
theme: "PaperMod"
enableRobotsTXT: true
enableEmoji: true
paginate: 10

services:
  googleAnalytics:
    ID: ""

params:
  env: production
  title: "AEO / GEO Operations Blog"
  description: "Living public runbooks for the aeo-app.ai 90-day AEO/GEO growth sprint and the APAC Relocation 30-day AEO/GEO sprint — schedules, content libraries, and prompts."
  keywords: [AEO, GEO, SEO, AI Search, ChatGPT, Gemini, Perplexity, Content Marketing, APAC]
  author: "AEO Intel + APAC Relocation"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  DateFormat: "January 2, 2006"
  homeInfoParams:
    Title: "AEO / GEO growth operations runbooks"
    Content: >
      Two living, day-by-day operating plans published as static sites so they stay
      crawlable and citable by AI engines:
      - the **AEO Intel** 90-day sprint for `aeo-app.ai`,
      - the **APAC Relocation** aggressive 30-day AEO/GEO sprint for `apacrelocation.com`.
      Each page is a self-contained plan document — schedule table, content library,
      and every writing prompt.
  socialIcons: []

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
